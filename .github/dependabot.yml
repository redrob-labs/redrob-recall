version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # The Rust crate is not at the repository root.
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Workflow actions are SHA-pinned, so this is how they get updated at all.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
