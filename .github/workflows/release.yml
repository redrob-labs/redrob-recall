name: Signed desktop release

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require release tag commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag commit must be reachable from origin/main"
            exit 1
          fi
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          patchelf libssl-dev
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete verification
        run: npm run verify

  rust-advisories:
    name: Rust security advisories
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust for security audit
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies
        run: cargo +stable audit --file src-tauri/Cargo.lock

  build:
    name: Build ${{ matrix.label }}
    if: github.event_name == 'push'
    needs: [validate, rust-advisories]
    permissions:
      contents: write
    environment: production-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: Linux x64
            platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - label: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS Intel
            platform: macos-14
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            platform: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          patchelf libssl-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Require release signing material
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CODESIGN_CERT_P12_BASE64 \
            APPLE_CODESIGN_CERT_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_API_ISSUER_ID; do
            test -n "${!name:-}"
          done
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          printf 'APPLE_API_KEY_PATH=%s\n' "$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/redrob-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security default-keychain -s "$RUNNER_TEMP/redrob-build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/redrob-build.keychain"
          security import "$RUNNER_TEMP/redrob-certificate.p12" -k "$RUNNER_TEMP/redrob-build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          CERT_ID="$(security find-identity -v -p codesigning "$RUNNER_TEMP/redrob-build.keychain" | awk -F'"' 'NR==1 {print $2}')"
          test -n "$CERT_ID"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$CERT_ID" >> "$GITHUB_ENV"

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw "Windows signing secrets are required"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "redrob-certificate.pfx"
          $link = $env:WIN_CSC_LINK.Trim()
          if ($link -match '^https://') {
            try {
              Invoke-WebRequest -Uri $link -OutFile $certificatePath -UseBasicParsing
            } catch {
              throw "Failed to download the Windows signing certificate over HTTPS"
            }
          } else {
            if ($link -match '^data:[^,]*;base64,') {
              $payload = $link.Substring($link.IndexOf(',') + 1)
            } else {
              $payload = $link
            }
            $payload = $payload -replace '\s', ''
            if ($payload -notmatch '^[A-Za-z0-9+/]+={0,2}$') {
              throw "WIN_CSC_LINK must be raw Base64 PFX data, a data:*;base64 URI, or an HTTPS URL"
            }
            try {
              [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($payload))
            } catch {
              throw "WIN_CSC_LINK contains invalid Base64 certificate data"
            }
          }

          $password = ConvertTo-SecureString $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $certificate = $imported | Where-Object {
            $_.HasPrivateKey -and
            $_.NotBefore.ToUniversalTime() -le [DateTime]::UtcNow -and
            $_.NotAfter.ToUniversalTime() -gt [DateTime]::UtcNow -and
            ($_.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid)
          } | Sort-Object NotAfter -Descending | Select-Object -First 1
          if (-not $certificate -or -not $certificate.Thumbprint) {
            throw "Imported PFX has no currently valid certificate with a private key and Code Signing EKU"
          }
          $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
          $chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::Online
          $chain.ChainPolicy.RevocationFlag = [Security.Cryptography.X509Certificates.X509RevocationFlag]::ExcludeRoot
          if (-not $chain.Build($certificate)) {
            $chainErrors = ($chain.ChainStatus | ForEach-Object { $_.StatusInformation.Trim() }) -join "; "
            throw "Windows code-signing certificate chain validation failed: $chainErrors"
          }
          "WIN_CSC_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Prepare signed updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          WIN_CSC_CERTIFICATE_THUMBPRINT: ${{ env.WIN_CSC_CERTIFICATE_THUMBPRINT }}
        run: npm run release:prepare

      - name: Build, sign, and upload installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: v__VERSION__
          releaseName: Redrob VectorDB v__VERSION__
          releaseBody: See CHANGELOG.md for release notes. Installers and updater bundles are signed; the release remains a draft until platform smoke tests are approved.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Verify Windows installer signatures and timestamps
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          WIN_CSC_CERTIFICATE_THUMBPRINT: ${{ env.WIN_CSC_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundlePath = Join-Path $PWD "src-tauri/target/$env:RELEASE_TARGET/release/bundle"
          $installers = @(Get-ChildItem -LiteralPath $bundlePath -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if (-not ($installers.Extension -contains '.exe') -or -not ($installers.Extension -contains '.msi')) {
            throw "Expected both signed NSIS and MSI installers"
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
                -not $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $env:WIN_CSC_CERTIFICATE_THUMBPRINT -or
                -not $signature.TimeStamperCertificate) {
              throw "Installer signature, signer, or timestamp verification failed: $($installer.Name)"
            }
          }

  publish-cdn:
    name: Publish stable updater CDN
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false
    permissions:
      actions: read
      contents: read
    environment: production-release
    concurrency:
      group: vectordb-cdn-stable
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out published release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate published release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Published release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if [[ ! "$RELEASE_TARGET" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$RELEASE_TARGET" == *..* ]]; then
            echo "::error::Release target_commitish is unsafe or unsupported"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" || {
            echo "::error::Release tag does not resolve to a commit"
            exit 1
          }
          TARGET_COMMIT=""
          for candidate in "refs/remotes/origin/$RELEASE_TARGET" "refs/tags/$RELEASE_TARGET" "$RELEASE_TARGET"; do
            if TARGET_COMMIT="$(git rev-parse --verify "$candidate^{commit}" 2>/dev/null)"; then
              break
            fi
          done
          if [[ -z "$TARGET_COMMIT" ]]; then
            echo "::error::Release target_commitish does not resolve to a commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Published release tag commit is not reachable from origin/main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_COMMIT" origin/main; then
            echo "::error::Published release target_commitish is not reachable from origin/main"
            exit 1
          fi
          successful_runs="$RUNNER_TEMP/successful-release-runs.json"
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&status=success&per_page=100" \
            > "$successful_runs"
          if ! jq -e --arg sha "$TAG_COMMIT" \
            'any(.[].workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            "$successful_runs" > /dev/null; then
            echo "::error::No successful tag-triggered release workflow exists for the published tag commit"
            exit 1
          fi

      - name: Download exact published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ASSETS_JSON="$RUNNER_TEMP/release-assets.json"
          ASSETS_DIR="$RUNNER_TEMP/release-assets"
          CDN_PLAN_PATH="$RUNNER_TEMP/cdn-plan.json"
          CDN_MANIFEST_PATH="$RUNNER_TEMP/cdn-latest.json"
          mkdir -p "$ASSETS_DIR"
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            | jq 'add' > "$ASSETS_JSON"
          if [[ "$(jq 'length' "$ASSETS_JSON")" -eq 0 ]]; then
            echo "::error::Published release has no assets"
            exit 1
          fi
          while IFS= read -r encoded_asset; do
            asset="$(printf '%s' "$encoded_asset" | base64 --decode)"
            asset_id="$(jq -er '.id' <<< "$asset")"
            asset_name="$(jq -er '.name' <<< "$asset")"
            if [[ ! "$asset_id" =~ ^[1-9][0-9]*$ ]] ||
               [[ -z "$asset_name" || "$asset_name" == */* || "$asset_name" == *\\* ||
                  "$asset_name" == *..* || "$asset_name" =~ [[:cntrl:]] ]]; then
              echo "::error::Published release contains unsafe asset metadata"
              exit 1
            fi
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$ASSETS_DIR/$asset_name"
          done < <(jq -r '.[] | @base64' "$ASSETS_JSON")
          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_ASSETS_PATH=$ASSETS_JSON"
            echo "RELEASE_ASSETS_DIR=$ASSETS_DIR"
            echo "CDN_PLAN_PATH=$CDN_PLAN_PATH"
            echo "CDN_MANIFEST_PATH=$CDN_MANIFEST_PATH"
          } >> "$GITHUB_ENV"

      - name: Read current stable CDN origin
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
          AWS_REGION: ap-northeast-2
          REDROB_CDN_BUCKET: ${{ secrets.REDROB_CDN_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" || -z "${REDROB_CDN_BUCKET:-}" ]]; then
            echo "::error::All Redrob CDN credentials and the bucket secret are required"
            exit 1
          fi
          if [[ ! "$REDROB_CDN_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] ||
             [[ "$REDROB_CDN_BUCKET" == *..* ]] ||
             [[ "$REDROB_CDN_BUCKET" == *.-* ]] ||
             [[ "$REDROB_CDN_BUCKET" == *-.* ]] ||
             [[ "$REDROB_CDN_BUCKET" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ "$REDROB_CDN_BUCKET" == xn--* ]] ||
             [[ "$REDROB_CDN_BUCKET" == *-s3alias ]] ||
             [[ "$REDROB_CDN_BUCKET" == *--ol-s3 ]]; then
            echo "::error::REDROB_CDN_BUCKET must be a bare, safe S3 bucket name"
            exit 1
          fi

          origin_manifest="$RUNNER_TEMP/origin-current-latest.json"
          origin_state="$RUNNER_TEMP/origin-latest-state.json"
          origin_error="$RUNNER_TEMP/origin-latest-error"
          if origin_metadata="$(aws s3api get-object \
            --bucket "$REDROB_CDN_BUCKET" \
            --key "vectordb/latest.json" \
            "$origin_manifest" 2>"$origin_error")"; then
            origin_etag="$(jq -er '.ETag' <<< "$origin_metadata")"
            jq -n --arg mode "if-match" --arg etag "$origin_etag" \
              '{ mode: $mode, etag: $etag }' > "$origin_state"
            echo "CURRENT_MANIFEST_PATH=$origin_manifest" >> "$GITHUB_ENV"
          elif grep -Eq '\(404\)|Not Found|NoSuchKey' "$origin_error"; then
            rm -f "$origin_manifest"
            jq -n --arg mode "if-none-match" '{ mode: $mode }' > "$origin_state"
          else
            echo "::error::Unable to read the current stable manifest from the CDN origin"
            cat "$origin_error" >&2
            exit 1
          fi
          echo "CDN_ORIGIN_STATE_PATH=$origin_state" >> "$GITHUB_ENV"

      - name: Prepare and validate CDN release
        run: npm run release:cdn:prepare

      - name: Upload and verify immutable versioned assets
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
          AWS_REGION: ap-northeast-2
          REDROB_CDN_BUCKET: ${{ secrets.REDROB_CDN_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" || -z "${REDROB_CDN_BUCKET:-}" ]]; then
            echo "::error::All Redrob CDN credentials and the bucket secret are required"
            exit 1
          fi
          candidate_version="$(jq -er '.candidateVersion' "$CDN_PLAN_PATH")"
          expected_prefix="vectordb/v$candidate_version"
          if ! jq -e \
            --arg prefix "$expected_prefix" \
            --arg assets "$RELEASE_ASSETS_DIR/" \
            '.versionPrefix == $prefix and .manifestKey == "vectordb/latest.json" and
             all(.assets[]; (.key | startswith($prefix + "/")) and (.localPath | startswith($assets)))' \
            "$CDN_PLAN_PATH" > /dev/null; then
            echo "::error::CDN plan escaped the approved version or release-asset paths"
            exit 1
          fi

          verify_head() {
            local key="$1" expected_sha="$2" expected_size="$3" expected_type="$4" expected_cache="$5"
            local head actual_sha actual_size actual_type actual_cache
            head="$(aws s3api head-object --bucket "$REDROB_CDN_BUCKET" --key "$key")"
            actual_sha="$(jq -r '.Metadata.sha256 // empty' <<< "$head")"
            actual_size="$(jq -r '.ContentLength' <<< "$head")"
            actual_type="$(jq -r '.ContentType // empty' <<< "$head")"
            actual_cache="$(jq -r '.CacheControl // empty' <<< "$head")"
            if [[ "$actual_sha" != "$expected_sha" || "$actual_size" != "$expected_size" ||
                  "$actual_type" != "$expected_type" || "$actual_cache" != "$expected_cache" ]]; then
              echo "::error::CDN object verification failed for key $key"
              exit 1
            fi
          }

          while IFS= read -r encoded_asset; do
            asset="$(printf '%s' "$encoded_asset" | base64 --decode)"
            local_path="$(jq -er '.localPath' <<< "$asset")"
            key="$(jq -er '.key' <<< "$asset")"
            sha256="$(jq -er '.sha256' <<< "$asset")"
            size="$(jq -er '.size' <<< "$asset")"
            content_type="$(jq -er '.contentType' <<< "$asset")"
            error_file="$RUNNER_TEMP/head-object-error"
            if existing="$(aws s3api head-object --bucket "$REDROB_CDN_BUCKET" --key "$key" 2>"$error_file")"; then
              existing_sha="$(jq -r '.Metadata.sha256 // empty' <<< "$existing")"
              existing_size="$(jq -r '.ContentLength' <<< "$existing")"
              if [[ "$existing_sha" != "$sha256" || "$existing_size" != "$size" ]]; then
                echo "::error::Immutable CDN key already exists with different content: $key"
                exit 1
              fi
              existing_path="$RUNNER_TEMP/existing-origin-object"
              aws s3api get-object \
                --bucket "$REDROB_CDN_BUCKET" \
                --key "$key" \
                "$existing_path" > /dev/null
              if [[ "$(sha256sum "$existing_path" | cut -d' ' -f1)" != "$sha256" ]] ||
                 [[ "$(stat -c '%s' "$existing_path")" != "$size" ]]; then
                echo "::error::Immutable CDN key bytes do not match the approved release asset: $key"
                exit 1
              fi
              rm -f "$existing_path"
            elif grep -Eq '\(404\)|Not Found|NoSuchKey' "$error_file"; then
              aws s3api put-object \
                --bucket "$REDROB_CDN_BUCKET" \
                --key "$key" \
                --body "$local_path" \
                --content-type "$content_type" \
                --cache-control "public, max-age=31536000, immutable" \
                --metadata "sha256=$sha256" \
                --if-none-match "*" > /dev/null
            else
              echo "::error::Unable to determine whether immutable CDN key exists: $key"
              cat "$error_file" >&2
              exit 1
            fi
            verify_head "$key" "$sha256" "$size" "$content_type" "public, max-age=31536000, immutable"
          done < <(jq -r '.assets[] | @base64' "$CDN_PLAN_PATH")

      - name: Verify referenced public updater bytes
        shell: bash
        run: |
          set -euo pipefail
          referenced_count="$(jq '[.assets[] | select(.referenced)] | length' "$CDN_PLAN_PATH")"
          if [[ "$referenced_count" -eq 0 ]]; then
            echo "::error::CDN plan contains no referenced updater assets"
            exit 1
          fi
          while IFS= read -r encoded_asset; do
            asset="$(printf '%s' "$encoded_asset" | base64 --decode)"
            url="$(jq -er '.url' <<< "$asset")"
            expected_sha="$(jq -er '.sha256' <<< "$asset")"
            expected_size="$(jq -er '.size' <<< "$asset")"
            public_path="$RUNNER_TEMP/public-updater-asset"
            verified=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location \
                --output "$public_path" \
                "$url?promotion-asset=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" &&
                 [[ "$(sha256sum "$public_path" | cut -d' ' -f1)" == "$expected_sha" ]] &&
                 [[ "$(stat -c '%s' "$public_path")" == "$expected_size" ]]; then
                verified=true
                break
              fi
              sleep 5
            done
            rm -f "$public_path"
            if [[ "$verified" != "true" ]]; then
              echo "::error::Referenced CDN updater bytes do not match the approved release asset: $url"
              exit 1
            fi
          done < <(jq -r '.assets[] | select(.referenced) | @base64' "$CDN_PLAN_PATH")

      - name: Publish stable manifest last
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
          AWS_REGION: ap-northeast-2
          REDROB_CDN_BUCKET: ${{ secrets.REDROB_CDN_BUCKET }}
        run: |
          set -euo pipefail
          manifest_key="$(jq -er '.manifestKey' "$CDN_PLAN_PATH")"
          manifest_sha256="$(jq -er '.manifestSha256' "$CDN_PLAN_PATH")"
          condition=()
          case "$(jq -er '.mode' "$CDN_ORIGIN_STATE_PATH")" in
            if-match)
              condition=(--if-match "$(jq -er '.etag' "$CDN_ORIGIN_STATE_PATH")")
              ;;
            if-none-match)
              condition=(--if-none-match "*")
              ;;
            *)
              echo "::error::CDN origin state has an unsupported publication mode"
              exit 1
              ;;
          esac
          aws s3api put-object \
            --bucket "$REDROB_CDN_BUCKET" \
            --key "$manifest_key" \
            --body "$CDN_MANIFEST_PATH" \
            --content-type "application/json" \
            --cache-control "no-store, max-age=0" \
            --metadata "sha256=$manifest_sha256" \
            "${condition[@]}" > /dev/null
          published_head="$(aws s3api head-object --bucket "$REDROB_CDN_BUCKET" --key "$manifest_key")"
          if [[ "$(jq -r '.Metadata.sha256 // empty' <<< "$published_head")" != "$manifest_sha256" ]] ||
             [[ "$(jq -r '.ContentLength' <<< "$published_head")" != "$(stat -c '%s' "$CDN_MANIFEST_PATH")" ]] ||
             [[ "$(jq -r '.ContentType // empty' <<< "$published_head")" != "application/json" ]] ||
             [[ "$(jq -r '.CacheControl // empty' <<< "$published_head")" != "no-store, max-age=0" ]]; then
            echo "::error::Published latest.json object metadata does not match the generated manifest"
            exit 1
          fi

      - name: Verify public stable manifest
        shell: bash
        run: |
          set -euo pipefail
          public_manifest="$RUNNER_TEMP/public-latest.json"
          local_normalized="$RUNNER_TEMP/local-normalized.json"
          public_normalized="$RUNNER_TEMP/public-normalized.json"
          jq -S -c . "$CDN_MANIFEST_PATH" > "$local_normalized"
          verified=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location \
              --output "$public_manifest" \
              "https://cdn.redrob.ai/vectordb/latest.json?promotion-verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" &&
               jq -S -c . "$public_manifest" > "$public_normalized" &&
               cmp --silent "$local_normalized" "$public_normalized"; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != "true" ]]; then
            echo "::error::Public stable manifest did not converge to the generated manifest"
            exit 1
          fi
          echo "Stable updater CDN promotion verified for v$(jq -r '.candidateVersion' "$CDN_PLAN_PATH")"
