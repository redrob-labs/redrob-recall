name: Signed desktop release

# tag v<version> on main  ->  validate  ->  build (Linux / macOS / Windows)  ->  updater-manifest  ->  publish
#
# The parts every redrob-labs repository shares are called, not copied:
#   - redrob-labs/.github/actions/sign-windows/sign.ps1      Authenticode through Azure Artifact Signing,
#                                                            run by Tauri's bundler as `bundle.windows.signCommand`
#   - redrob-labs/.github/.github/workflows/release-publish.yml   SHA256SUMS.txt, redrob-launcher.json, the release
#
# Rules this file encodes:
#   - a tag push releases; `workflow_dispatch` with a version is a DRY RUN: every job builds, signs and
#     checks exactly as on a tag, and nothing is published;
#   - Windows: compile, THEN `azure/login` (OpenID Connect), THEN bundle -- the login token is short-lived
#     and the compile is long. No certificate file and no client secret anywhere; on a tag the leg refuses
#     to run with signing unconfigured rather than ship an unsigned installer;
#   - the build legs run in the `release` environment with `id-token: write`;
#   - the release is PUBLISHED as latest by the shared job once every build leg and the updater
#     contract have passed (prerelease when the version carries a `-`). `releases/latest/download/latest.json`
#     is the update channel, so publication is what makes a version live.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for a dry run, e.g. 0.4.0-1 (builds, signs and checks; publishes nothing)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT: Redrob Recall
  PRODUCT_URL: https://github.com/${{ github.repository }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      # The version without the leading v: the tag's, or the dry-run input.
      version: ${{ steps.version.outputs.version }}
      # The build matrix and the updater platform keys, launcher tokens and asset suffixes the
      # release must carry, all derived from the single list in scripts/release-matrix.mjs.
      matrix: ${{ steps.release-matrix.outputs.matrix }}
      platforms: ${{ steps.release-matrix.outputs.platforms }}
      asset_suffixes: ${{ steps.release-matrix.outputs.asset_suffixes }}
      launcher_tokens: ${{ steps.release-matrix.outputs.launcher_tokens }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"
          else
            echo "::error::not a tag push and no version input"; exit 1
          fi
          # X.Y.Z, optionally with a NUMERIC pre-release identifier (0.4.0-1). Tauri's MSI bundler
          # refuses any other pre-release form ("optional pre-release identifier in app version
          # must be numeric-only and cannot be greater than 65535 for msi target"), measured on the
          # first dry run of this workflow with 0.3.3-rc.1.
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]{0,4}))?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-1 (the Windows MSI accepts only a numeric pre-release identifier up to 65535)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "### ${PRODUCT} v$v (\`${GITHUB_SHA::9}\`, ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"
      - name: Require release tag commit on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag commit must be reachable from origin/main"
            exit 1
          fi
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          patchelf libssl-dev
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Resolve the release matrix
        id: release-matrix
        run: node scripts/release-matrix.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install locked dependencies
        run: npm ci
      # On a tag, check-version.mjs (inside verify) also requires the tag to equal the version the
      # three manifests declare.
      - name: Run complete verification
        run: npm run verify

  rust-advisories:
    name: Rust security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust for security audit
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies
        run: cargo +stable audit --file src-tauri/Cargo.lock

  build:
    name: Build ${{ matrix.label }}
    needs: [validate, rust-advisories]
    # `release` is the environment the organization's federated credential names
    # (repo:redrob-labs/<repo>:environment:release); any other name is refused by Azure.
    environment: release
    permissions:
      contents: read
      # The OpenID Connect token `azure/login` exchanges for the Artifact Signing credential on the
      # Windows leg. The other legs never call the login step.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Generated by scripts/release-matrix.mjs in the validate job. macOS Intel is excluded
        # because ort-sys ships no ONNX Runtime binary for it; the updater platform keys the
        # updater-manifest job requires come from that same single list.
        include: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      # Plain IDs (not credentials); here so the login step can be skipped on a dry run where
      # signing is not set up, and so a tag can refuse to build unsigned.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      # Read by the shared sign.ps1 when Tauri's bundler runs it for the executable and each installer.
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_CERT_PROFILE: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
      SIGN_DESCRIPTION: Redrob Recall
      SIGN_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The one copy of the Windows signing recipe, for Tauri's `bundle.windows.signCommand`.
      - name: Check out the shared redrob-labs signing recipe
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redrob-labs/.github
          ref: main
          path: .redrob-shared

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        # desktop-file-utils: the AppImage repack step below runs appimagetool, which refuses to
        # pack without `desktop-file-validate` on PATH (measured on the v0.3.0 Linux leg).
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          patchelf libssl-dev desktop-file-utils

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Require release signing material
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      # A dry run may build unsigned (the shared script warns and leaves the files as they are); a
      # tag may not. An unsigned installer that reaches a user is worse than no installer: it
      # trains people to click through the warning.
      - name: Require Windows signing configuration on a tag
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_CERT_PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured; a tag does not release an unsigned Windows installer"
              exit 1
            fi
          done

      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CODESIGN_CERT_P12_BASE64 \
            APPLE_CODESIGN_CERT_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_API_ISSUER_ID; do
            test -n "${!name:-}"
          done
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          printf 'APPLE_API_KEY_PATH=%s\n' "$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/redrob-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security default-keychain -s "$RUNNER_TEMP/redrob-build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/redrob-build.keychain"
          security import "$RUNNER_TEMP/redrob-certificate.p12" -k "$RUNNER_TEMP/redrob-build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          CERT_ID="$(security find-identity -v -p codesigning "$RUNNER_TEMP/redrob-build.keychain" | awk -F'"' 'NR==1 {print $2}')"
          test -n "$CERT_ID"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$CERT_ID" >> "$GITHUB_ENV"

      # Writes src-tauri/tauri.release.conf.json: updater key and endpoint, the release version,
      # and on Windows the shared sign.ps1 as the bundler's sign command.
      - name: Prepare signed updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: npm run release:prepare

      # Windows compiles first and bundles after the login: Tauri signs the executable and the
      # installers while bundling, and the OpenID Connect token is short-lived.
      - name: Compile (Windows, unsigned, no bundle)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target "$RELEASE_TARGET" --no-bundle --config src-tauri/tauri.release.conf.json

      - name: Log in to Azure (OIDC)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # macOS signs and notarizes here through the Tauri CLI (APPLE_* environment). Windows signs
      # here through the shared sign.ps1 the bundler calls for the executable, the NSIS installer and
      # the MSI; each call verifies with `signtool verify /pa` and logs `signed by CN=McKinley Rice, Inc.`.
      - name: Build and bundle
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: npm run tauri build -- --target "$RELEASE_TARGET" --bundles "$BUNDLES" --config src-tauri/tauri.release.conf.json

      # The e2e cargo feature lets a WebDriver test choose the library folder through an environment
      # variable. Prove from the shipped bytes, on every platform, that it is not in this build.
      - name: Prove the release binary carries no end-to-end test hook
        shell: bash
        run: |
          set -euo pipefail
          dir="src-tauri/target/${RELEASE_TARGET}/release"
          # Prefer the .exe: on Windows, Git Bash answers `-f redrob-recall` with true when only
          # redrob-recall.exe exists, so the old probe handed node a path that is not there.
          if [ -f "$dir/redrob-recall.exe" ]; then bin="$dir/redrob-recall.exe"; else bin="$dir/redrob-recall"; fi
          node scripts/check-e2e-feature.mjs "$bin"

      # The default bundler ships the build host's libwayland in the AppImage, and on Mesa 25+ that
      # makes WebKitWebProcess abort with EGL_BAD_PARAMETER: the window opens and stays blank
      # (tauri-apps/tauri#15665). Measured on v0.2.0 before this step existed -- strace on the web
      # process, then the same AppImage with only those four libraries removed rendered with no
      # environment overrides. Repacking changes the bytes, so the script also re-signs; the staged
      # .sig is what latest.json carries and what the updater-manifest job verifies.
      - name: Repack the AppImage without bundled Wayland, and re-sign it
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Pinned by digest: this binary rewrites a signed release artifact.
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" "$APPIMAGETOOL_URL"
          echo "${APPIMAGETOOL_SHA256}  ${tool}" | sha256sum -c -
          chmod +x "$tool"
          # Runners have no FUSE; both the tool and the AppImage run through their own extractor.
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash scripts/resign-linux-appimage.sh "src-tauri/target/${RELEASE_TARGET}/release/bundle" "$tool"

      # Both installers must exist and, when signing is configured, carry a Valid Authenticode
      # signature from the organization's certificate (`signtool verify /pa` in sign.ps1 already
      # refused anything else; this is the gate that the bundler called it for every file). A dry run
      # without signing configuration reports the installers as unsigned and passes.
      - name: Verify the Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundlePath = Join-Path $PWD "src-tauri/target/$env:RELEASE_TARGET/release/bundle"
          $installers = @(Get-ChildItem -LiteralPath $bundlePath -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if (-not ($installers.Extension -contains '.exe') -or -not ($installers.Extension -contains '.msi')) {
            throw "Expected both NSIS and MSI installers"
          }
          $configured = $env:ARTIFACT_SIGNING_ENDPOINT -and $env:ARTIFACT_SIGNING_ACCOUNT -and $env:ARTIFACT_SIGNING_CERT_PROFILE
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if (-not $configured) {
              Write-Host "::warning::$($installer.Name) is unsigned (Artifact Signing not configured; dry run)"
              continue
            }
            if ($signature.Status -ne 'Valid') {
              throw "$($installer.Name) signature status $($signature.Status): $($signature.StatusMessage)"
            }
            $cn = $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($cn -ne 'McKinley Rice, Inc.') {
              throw "$($installer.Name) signed by CN=$cn, expected CN=McKinley Rice, Inc."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$($installer.Name) carries no trusted timestamp"
            }
            Write-Host "$($installer.Name) signed by CN=$cn status=$($signature.Status)"
          }

      # Tauri names its files `Redrob Recall_<ver>_<arch>.<ext>`; Redrob Launcher installs only
      # `redrob-recall-<ver>-<os>-<arch>.<ext>` (scripts/release-asset-names.mjs). The files are copied
      # under the launcher names into the release artifact, and this leg's updater entries (signature
      # text + published download URL) are written as a fragment for the updater-manifest job.
      - name: Stage the assets under the names Redrob Launcher installs
        shell: bash
        run: >-
          node scripts/stage-release-assets.mjs
          "src-tauri/target/${RELEASE_TARGET}/release/bundle" "$RELEASE_VERSION" "$RELEASE_TARGET"
          dist/release "dist/updater/${RELEASE_TARGET}.json"

      - name: Upload the release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

      - name: Upload the updater fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-${{ matrix.target }}
          path: dist/updater/*.json
          if-no-files-found: error

      - name: Remove the temporary keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/redrob-build.keychain" ]; then security delete-keychain "$RUNNER_TEMP/redrob-build.keychain" || true; fi

  # latest.json IS the feed on GitHub Releases. Missing it does not fail an install, it silently
  # freezes every existing client on its current version; a URL pointing anywhere but this
  # repository's own release assets is the same failure. So the manifest is assembled from the legs'
  # fragments and the whole set is checked -- names, platforms, URLs, and every signature against
  # the bytes it covers -- BEFORE the publish job can make it latest. The manifest rides to the
  # publish job as a `release-*` artifact like every other asset.
  updater-manifest:
    name: Updater contract on the release assets
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download the release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Download the updater fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: updater-*
          path: fragments
          merge-multiple: true
      - name: Assemble latest.json and verify the updater contract
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          REQUIRED_PLATFORMS: ${{ needs.validate.outputs.platforms }}
          REQUIRED_LAUNCHER_TOKENS: ${{ needs.validate.outputs.launcher_tokens }}
          REQUIRED_ASSET_SUFFIXES: ${{ needs.validate.outputs.asset_suffixes }}
        run: node scripts/assemble-updater-manifest.mjs assets fragments "${{ needs.validate.outputs.version }}"
      - name: Upload the updater manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-updater-manifest
          path: assets/latest.json
          if-no-files-found: error

  publish:
    needs: [validate, rust-advisories, build, updater-manifest]
    if: always() && github.ref_type == 'tag' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped')
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.validate.outputs.version }}
      title: Redrob Recall
      launcher_manifest: true
      publish: true
