# SPDX-License-Identifier: Apache-2.0

[package]
name = "redrob-recall"
description = "Redrob Recall: a local memory and embedding-index layer for the Redrob apps, with a thin desktop window"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "redrob-recall"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
eframe = { workspace = true, features = ["wgpu", "accesskit", "wayland", "x11", "persistence", "default_fonts"] }
egui = { workspace = true }
egui_extras = { workspace = true, features = ["image"] }
log.workspace = true
notify.workspace = true
open.workspace = true
redrob-recall-api.workspace = true
redrob-recall-core.workspace = true
reqwest.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webbrowser.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
