# Pinned upstream specifications. Update only with compatibility review.
#
# Same schema as redrob-canvas and redrob-query, deliberately: three products read from upstream
# authorities and they should not each invent their own vocabulary for it.
#
# `kind` is the load-bearing field, and scripts/verify-upstream.mjs checks it:
#
#   code       Source code is COPIED into this repository, file by file. The upstream licence
#              therefore binds our distribution. Every such source needs an attribution entry in
#              UPSTREAM_NOTICES.md recording its pinned commit, and a `boundary` saying where
#              copying stops.
#   algorithm  Read for behaviour and results. Nothing is copied. We reimplement and compare. No
#              copyright obligation follows from reading, so these entries are a reproducibility
#              record, not a licence claim.
#   library    Linked or embedded as a dependency, not copied. Licence binds distribution of the
#              dependency, not our source.
#   protocol   A wire format or API we speak. Nothing is copied and nothing is linked.
#
# THE INBOUND DIRECTION HERE IS THE OPPOSITE OF redrob-query'S, and the validator differs
# accordingly. This product is Apache-2.0, which is permissive, so it can absorb permissive source
# only. A GPL `code` source would force this product to GPL -- the same one-way door redrob-query
# walked through on purpose for Beekeeper Studio. Here there is no reason to, so copying GPL source
# into this repository is refused rather than merely discouraged. Copying the query validator's
# regex across would have silently allowed exactly that.

[bloop]
repository = "https://github.com/BloopAI/bloop"
branch = "oss"
commit = "431e9e82c5a293c40f22aadb3615c3aa387af82e"
kind = "code"
role = ["code indexing", "semantic and literal search", "repository sync", "chunking"]
license = "Apache-2.0; same licence as this product, so no relicense is needed"
# Archived upstream, last commit 2024-12-04. That is a feature for a pin rather than a problem: the
# tree cannot move under us, and Apache-2.0 source stays usable regardless of whether anyone
# maintains it. What it does mean is that no upstream fix is coming, so anything we take we own.
#
# Ships a single root LICENSE and no NOTICE file (verified: one path matching
# /licen[sc]e|notice|copying/i in the pinned tree), so Apache section 4(d) imposes no propagation
# duty -- the same position redrob-canvas is in with Graphite.
#
# DECIDED (item 1b.0, docs/index-engine-decision.md): FTS5 STAYS. Tantivy is not adopted.
#
# Tested rather than argued. Every feature of bloop's query/grammar.pest was run against FTS5:
# implicit AND, explicit or, grouping, phrases and column filters all work, and FTS5 additionally
# has NOT, NEAR and prefix matching which bloop's grammar does not. Exactly ONE feature is out of
# reach -- regex -- because FTS5 is a tokenised inverted index and a regex needs the term dictionary
# walked. bloop needs that because developers grep CODE; this product indexes PDF, DOCX, HTML and
# prose, and lists source code as `planned`. If it ever indexes code the question reopens honestly.
#
# Four of bloop's labels do not apply at all: repo:, org: and branch: are git concepts, and symbol:
# needs code intelligence. path: is not an FTS5 term and does not need to be -- search.rs already
# filters by path prefix in SQL after fusion.
#
# Found while reading, and NOT in the plan: chunks_fts indexes ONE column. `content='chunks'` is an
# external-content option, not a column. So a document whose TITLE matches a search does not come
# back unless the words are also in its body, and heading:/path: filters have nothing to filter on.
# That is a user-visible gap in a document search tool and it has nothing to do with Tantivy: part
# of the case for a "richer query language" is a case for using FTS5 properly.
#
# So 1b.3 takes bloop's query parser, planner shape, ranking, stopwords and snippet selection, and
# targets FTS5 MATCH. It does not take the index.
boundary = "take the query language, ranking and snippet selection; do NOT take the Tantivy index -- decided in docs/index-engine-decision.md"

[qdrant_edge]
repository = "https://github.com/qdrant/qdrant"
registry = "https://crates.io/crates/qdrant-edge"
version = "0.8.0"
kind = "redistributed"
role = ["embedded vector search"]
license = "Apache-2.0"
# CORRECTED 2026-09-30, and both corrections were hidden by the same thing: this entry's kind was never
# printed by check:upstream, so nobody re-read it.
#
# It was `[qdrant]` with `minimum_version = "1.12"` and `kind = "library"`. Three things wrong:
#
#   * WRONG ARTEFACT. We do not embed the Qdrant server. src-tauri/Cargo.toml depends on the
#     `qdrant-edge` CRATE, which is a different artefact published to crates.io.
#   * WRONG VERSION. 1.12 is the server's version line. Cargo.lock pins qdrant-edge 0.8.0, and Cargo
#     pins it EXACTLY (`=0.8.0`), so a `minimum_version` floor also misdescribed how it is pinned.
#   * WRONG KIND. A Rust crate is compiled INTO the binary we distribute, so it is redistributed rather
#     than linked. Apache-2.0 attaches a notice obligation to that distribution -- section 4(d) -- which
#     NOTICE already carries; the kind now says why that notice is required rather than optional.
#
# `library` remains the right kind for something genuinely linked at runtime, which is how canvas's
# babl, gegl, lcms2 and libmypaint are used: off by default, discovered by pkg-config, never vendored.
boundary = "Compiled into the shipped binary as a Rust crate. No source is copied into this tree."

[redrob_code]
repository = "https://github.com/redrob-labs/redrob-code"
tag = "v0.1.0"
commit = "0a144f3b719d1f0de9101747327276507ad68ba3"
kind = "protocol"
role = ["Redrob API protocol", "device authorization", "streaming tool calls", "model discovery"]
# A tag and the commit it points at. A bare commit reachable only from a deleted ref does not
# survive, and this engine deleted every tag in its repository once when it reset its version line.
